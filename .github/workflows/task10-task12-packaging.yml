name: Task 10–12 research contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research/historical_replay/task10/**"
      - "scripts/research/historical_replay/task11/**"
      - "scripts/research/historical_replay/task12/**"
      - "tests/jobs/test_task10_entropy20.py"
      - "tests/jobs/test_task11*.py"
      - "tests/jobs/test_task12*.py"
      - ".github/workflows/task10-task12-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test Task10 seed recovery and Task11/12 scientific contracts
        run: |
          python -m pytest -q \
            tests/jobs/test_task10_entropy20.py \
            tests/jobs/test_task11_fisher.py \
            tests/jobs/test_task11_protocol.py \
            tests/jobs/test_task11_repair_import.py \
            tests/jobs/test_task12_protocol.py
  bald-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate BALD numerical and MC-dropout semantics
        run: python -m pytest tests/jobs/test_task12_bald.py -q
