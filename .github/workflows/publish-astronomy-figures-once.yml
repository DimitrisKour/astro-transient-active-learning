name: Publish astronomy notebook figures (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-astronomy-figures-once.yml"

permissions:
  contents: write

jobs:
  embed-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[teaching]"
      - name: Execute all astronomy notebook cells on CPU
        run: |
          python scripts/examples/execute_astro_notebook.py --output "$RUNNER_TEMP/astronomy_executed.ipynb"
      - name: Validate embedded plots and updated notebook
        run: |
          python - <<'PY'
          import os
          import nbformat
          p = os.path.join(os.environ["RUNNER_TEMP"], "astronomy_executed.ipynb")
          nb = nbformat.read(p, as_version=4)
          nbformat.validate(nb)
          figs = [output for cell in nb.cells if cell.cell_type == "code"
                  for output in cell.get("outputs", [])
                  if output.get("data", {}).get("image/png")]
          source = "\n".join(cell.source for cell in nb.cells if cell.cell_type == "code")
          assert len(figs) >= 6, f"Expected at least 6 charts, got {len(figs)}"
          assert "FULL_DATA_F1 = 0.6367" in source
          assert "policies = ('random', *policies)" in source
          assert "random_mean =" in source
          print(f"PASS: {len(figs)} figures; reference and random baseline present.")
          PY
      - name: Commit executed notebook to main
        run: |
          cp "$RUNNER_TEMP/astronomy_executed.ipynb" examples/02_applecider_astronomy_active_learning.ipynb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/02_applecider_astronomy_active_learning.ipynb
          if git diff --cached --quiet; then
            echo "Notebook outputs already up to date."
          else
            git commit -m "Embed executed astronomy learning-curve figures"
            git push origin HEAD:main
          fi
