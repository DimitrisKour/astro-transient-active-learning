name: Task13–15 research packaging

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research/historical_replay/task13/**"
      - "scripts/research/historical_replay/task14/**"
      - "scripts/research/historical_replay/task15/**"
      - "tests/test_task13*.py"
      - "tests/test_task14*.py"
      - "tests/test_task15*.py"
      - ".github/workflows/task13-task15-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portable contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run synthetic Task13–15 without private frozen Task11 data
        run: |
          python -m pytest -q \
            tests/test_task13_control.py tests/test_task13_core.py \
            tests/test_task13_extension.py tests/test_task13_frozen_identity.py \
            tests/test_task14_similar.py tests/test_task15_cli_regression.py \
            tests/test_task15_direct.py \
            -k "not frozen_patch_includes_batch_acquisition_config and not strict_patch_against_uploaded_task11_frozen and not patch_verified_parent and not integrated_interactive_query_journal_resume"
