name: Historical replay packaging

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research/historical_replay/**"
      - "scripts/adaptive/task4_submit.sh"
      - "scripts/adaptive/task5_submit.sh"
      - "scripts/adaptive/install_task5_restart.py"
      - "tests/jobs/test_task4_package.py"
      - "tests/jobs/test_task5_restart.py"
      - ".github/workflows/historical-replay-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portable dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check Task4/Task5 package, derivation and mocked Slurm contracts
        run: python -m pytest tests/jobs/test_task4_package.py tests/jobs/test_task5_restart.py -q
      - name: Check compatibility launcher syntax
        run: bash -n scripts/adaptive/task4_submit.sh scripts/adaptive/task5_submit.sh
