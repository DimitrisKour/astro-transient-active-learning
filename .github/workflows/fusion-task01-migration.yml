name: Fusion Task0-Task1 migration compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research/fusion_image/task0/**"
      - "scripts/research/fusion_image/task1/**"
      - "scripts/research/fusion_image/task0_task1_README.md"
      - "tests/jobs/test_fusion_task01_safe_migration.py"
      - "tests/astronomy/fusion_image/test_task0_full_history_v1.py"
      - "tests/astronomy/fusion_image/test_task1_closed_loop_v1.py"
      - ".github/workflows/fusion-task01-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-compatibility:
    name: Task 0 and Task 1 old and grouped scientific contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify immutable legacy job scripts and new isolated paths
        run: |
          python -m pytest tests/jobs/test_fusion_task01_safe_migration.py -q
      - name: Test original scientific and acquisition contracts
        run: |
          python -m pytest -q \
            tests/astronomy/fusion_image/test_task0_full_history_v1.py \
            tests/astronomy/fusion_image/test_task1_closed_loop_v1.py
      - name: Check new worker and launcher syntax
        run: |
          python -m compileall -q scripts/research/fusion_image/task0 scripts/research/fusion_image/task1
          find scripts/research/fusion_image/task0 scripts/research/fusion_image/task1 -type f \( -name '*.sbatch' -o -name '*.sh' \) -exec bash -n {} \;
