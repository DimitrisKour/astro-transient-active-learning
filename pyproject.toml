[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "al-pipeline"
version = "0.1.0"
description = "Active learning for astronomical transients with a reusable model-independent core"
readme = "README.md"
license = "MIT"
authors = [{name = "Dimitris Kourtesis"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
analysis = ["pandas", "matplotlib", "scikit-learn"]
teaching = ["pandas", "matplotlib", "scikit-learn", "ipykernel", "nbformat", "nbclient"]
astronomy = ["torch", "torchvision", "astropy", "pandas", "matplotlib", "scikit-learn"]
dev = ["pytest", "ruff", "pandas", "matplotlib", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["al_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/integration"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "F841"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["E402"]
